services:
  mongo:
    image: mongo:7
    container_name: icu-monitor-mongo
    ports: ["27017:27017"]
    volumes: ["icu-mongo-data:/data/db"]
    restart: unless-stopped

  server:
    build: ./server
    container_name: icu-monitor-server
    ports: ["5000:5000"]
    env_file: ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/icu_monitor
      CLIENT_URL: http://localhost:5173
    depends_on: [mongo]
    restart: unless-stopped

  client:
    build: ./client
    container_name: icu-monitor-client
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_SOCKET_URL: http://localhost:5000
    depends_on: [server]
    restart: unless-stopped

volumes:
  icu-mongo-data:
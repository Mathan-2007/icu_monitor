<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom ICU Monitor Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f5f5f5;
      }
      h1 {
        color: #333;
        text-align: center;
      }
      p {
        color: #666;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>ICU Monitor Dashboard</h1>
    <p>This is a custom HTML page served by Nginx for the ICU Monitor application.</p>
    <p>Last updated: <span id="timestamp"></span></p>
    <script>
      document.getElementById('timestamp').textContent = new Date().toLocaleString();
    </script>
  </body>
</html>
